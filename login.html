<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <!-- Icon sprite: define each icon once, reuse with <use> -->
  <svg width="0" height="0"
  style="position:absolute" aria-hidden="true">
    <symbol id="icon-mail" viewBox="0 0 24 24">
      <rect width="20" height="16" x="2" y="4" rx="2"/>
      <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
    </symbol>
    <symbol id="icon-lock" viewBox="0 0 24 24">
      <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
      <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24">
      <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
      <path d="m9 12 2 2 4-4"/>
    </symbol>
    <symbol id="icon-lock-keyhole" viewBox="0 0 24 24">
      <circle cx="12" cy="16" r="1"/>
      <rect x="3" y="10" width="18" height="12" rx="2"/>
      <path d="M7 10V7a5 5 0 0 1 10 0v3"/>
    </symbol>
    <symbol id="icon-user-plus" viewBox="0 0 24 24">
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
      <circle cx="9" cy="7" r="4"/>
      <line x1="19" x2="19" y1="8" y2="14"/>
      <line x1="22" x2="16" y1="11" y2="11"/>
    </symbol>
    <symbol id="icon-eye" viewBox="0 0 24 24">
      <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
      <circle cx="12" cy="12" r="3"/>
    </symbol>
    <symbol id="icon-eye-off" viewBox="0 0 24 24">
      <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/>
      <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/>
      <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/>
      <path d="m2 2 20 20"/>
    </symbol>
  </svg>
  <main>


    <section class="login-container" id="login-view" aria-labelledby="login-title">
      <header class="card-header">
        <div class="badge" aria-hidden="true">
          <svg class="icon icon--badge"><use href="#icon-lock-keyhole"/></svg>
        </div>
        <h1 id="login-title">Login</h1>
      </header>

      <form action="#" method="post">
        <div class="form-group">
          <label for="login-email">Email</label>
          <div class="input-wrap">
            <svg class="icon icon--field" aria-hidden="true"><use href="#icon-mail"/></svg>
            <input type="email" id="login-email" name="email"
                   placeholder="you@example.com" autocomplete="email" required>
          </div>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="input-wrap has-toggle">
            <svg class="icon icon--field" aria-hidden="true"><use href="#icon-lock"/></svg>
            <input type="password" id="login-password" name="password"
                   placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="toggle-password" data-target="login-password" aria-label="Show password" aria-pressed="false">
              <svg class="icon" aria-hidden="true"><use href="#icon-eye"/></svg>
            </button>
          </div>
        </div>

        <button type="submit">Login</button>
      </form>

      <p class="register-text">
        Don't have an account? <a href="#register" data-view="register">Register</a>
      </p>
    </section>


    <section class="login-container" id="register-view" aria-labelledby="register-title" hidden>
      <header class="card-header">
        <div class="badge" aria-hidden="true">
          <svg class="icon icon--badge"><use href="#icon-user-plus"/></svg>
        </div>
        <h1 id="register-title">Create account</h1>
      </header>

      <form action="#" method="post" novalidate>
        <div class="form-group">
          <label for="fullname">Full Name</label>
          <div class="input-wrap">
            <svg class="icon icon--field" aria-hidden="true"><use href="#icon-user"/></svg>
            <input type="text" id="fullname" name="fullname"
                   placeholder="Your full name" autocomplete="name"
                   aria-describedby="fullname-error" required>
          </div>
          <p class="error-message" id="fullname-error" aria-live="polite"></p>
        </div>

        <div class="form-group">
          <label for="register-email">Email</label>
          <div class="input-wrap">
            <svg class="icon icon--field" aria-hidden="true"><use href="#icon-mail"/></svg>
            <input type="email" id="register-email" name="email"
                   placeholder="you@example.com" autocomplete="email"
                   aria-describedby="register-email-error" required>
          </div>
          <p class="error-message" id="register-email-error" aria-live="polite"></p>
        </div>

        <div class="form-group">
          <label for="register-password">Password</label>
          <div class="input-wrap has-toggle">
            <svg class="icon icon--field" aria-hidden="true"><use href="#icon-lock"/></svg>
            <input type="password" id="register-password" name="password"
                   placeholder="Create a password" autocomplete="new-password"
                   minlength="8" aria-describedby="register-password-error" required>
            <button type="button" class="toggle-password" data-target="register-password" aria-label="Show password" aria-pressed="false">
              <svg class="icon" aria-hidden="true"><use href="#icon-eye"/></svg>
            </button>
          </div>
          <p class="error-message" id="register-password-error" aria-live="polite"></p>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <div class="input-wrap has-toggle">
            <svg class="icon icon--field" aria-hidden="true"><use href="#icon-shield"/></svg>
            <input type="password" id="confirm-password" name="confirm-password"
                   placeholder="Re-enter your password" autocomplete="new-password"
                   aria-describedby="confirm-password-error" required>
            <button type="button" class="toggle-password" data-target="confirm-password" aria-label="Show password" aria-pressed="false">
              <svg class="icon" aria-hidden="true"><use href="#icon-eye"/></svg>
            </button>
          </div>
          <p class="error-message" id="confirm-password-error" aria-live="polite"></p>
        </div>

        <button type="submit">Register</button>
      </form>

      <p class="register-text">
        Already have an account? <a href="#login" data-view="login">Login</a>
      </p>
    </section>

  </main>

  <script src="navigation.js" defer></script>
</body>
</html>
