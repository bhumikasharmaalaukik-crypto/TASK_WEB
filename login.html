<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TASK_WEB</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main>

    <section class="login-container" id="login-view" aria-labelledby="login-title">
      <h1 id="login-title">Login</h1>

      <form action="#" method="post">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email"
                 placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password"
                 placeholder="Enter your password" autocomplete="current-password" required>
        </div>

        <button type="submit">Login</button>
      </form>

      <p class="register-text">
        Don't have an account? <a href="#register">Register</a>
      </p>
    </section>

    <section class="login-container" id="register-view" aria-labelledby="register-title" hidden>
      <h1 id="register-title">Create account</h1>

      <form action="#" method="post" novalidate>
        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" name="fullname"
                 placeholder="Your full name" autocomplete="name"
                 aria-describedby="fullname-error" required>
          <p class="error-message" id="fullname-error" aria-live="polite"></p>
        </div>

        <div class="form-group">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" name="email"
                 placeholder="you@example.com" autocomplete="email"
                 aria-describedby="register-email-error" required>
          <p class="error-message" id="register-email-error" aria-live="polite"></p>
        </div>

        <div class="form-group">
          <label for="register-password">Password</label>
          <input type="password" id="register-password" name="password"
                 placeholder="Create a password" autocomplete="new-password"
                 minlength="8" aria-describedby="register-password-error" required>
          <p class="error-message" id="register-password-error" aria-live="polite"></p>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirm-password"
                 placeholder="Re-enter your password" autocomplete="new-password"
                 aria-describedby="confirm-password-error" required>
          <p class="error-message" id="confirm-password-error" aria-live="polite"></p>
        </div>

        <button type="submit">Register</button>
      </form>

      <p class="register-text">
        Already have an account? <a href="#login">Login</a>
      </p>
    </section>

  </main>

  <script>
    const loginView = document.getElementById("login-view");
    const registerView = document.getElementById("register-view");

    // Show one view and hide the other, based on the URL hash (#login / #register)
    function showView(focusFirstField) {
      const isRegister = location.hash === "#register";

      loginView.hidden = isRegister;
      registerView.hidden = !isRegister;
      document.title = isRegister ? "Register" : "Login";

      if (focusFirstField) {
        const activeView = isRegister ? registerView : loginView;
        activeView.querySelector("input").focus();
      }
    }

    window.addEventListener("hashchange", () => showView(true));
    showView(false);   // set the correct view when the page first loads
  </script>
</body>
</html>
